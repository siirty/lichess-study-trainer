name: Publish verified iPhone preview
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful main-branch iOS workflow run ID
        required: true
        type: string
      build_commit:
        description: Full source commit SHA from that run
        required: true
        type: string
      ipa_sha256:
        description: Independently verified device IPA SHA-256
        required: true
        type: string
      preview_tag:
        description: Existing tag such as ios-preview-v0.1.1
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      BUILD_COMMIT: ${{ inputs.build_commit }}
      IPA_SHA256: ${{ inputs.ipa_sha256 }}
      PREVIEW_TAG: ${{ inputs.preview_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify successful build and download exact device artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          for key, pattern in [('BUILD_RUN', r'[0-9]+'), ('BUILD_COMMIT', r'[0-9a-f]{40}'), ('IPA_SHA256', r'[0-9a-f]{64}'), ('PREVIEW_TAG', r'ios-preview-v[0-9]+\.[0-9]+\.[0-9]+')]:
              assert re.fullmatch(pattern, os.environ[key]), 'Invalid ' + key
          PY
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          gh api "repos/$GH_REPO/git/ref/tags/$PREVIEW_TAG" > tag.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          tag = json.load(open('tag.json'))
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['head_sha'] == os.environ['BUILD_COMMIT']
          assert run['head_branch'] == 'main' and run['head_repository']['full_name'] == os.environ['GH_REPO']
          assert run['path'] == '.github/workflows/ios.yml'
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['BUILD_COMMIT']
          PY
          gh run download "$BUILD_RUN" -n ios-unsigned-ipa-for-local-signing -D release
          python3 - <<'PY'
          import hashlib, os, pathlib, plistlib, zipfile
          ipa = pathlib.Path('release/study-trainer-unsigned.ipa')
          with ipa.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == os.environ['IPA_SHA256']
          with zipfile.ZipFile(ipa) as archive:
              info = plistlib.loads(archive.read('Payload/Runner.app/Info.plist'))
              assert info['CFBundleIdentifier'] == 'org.studytrainer.standalone'
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
              assert os.environ['PREVIEW_TAG'] == 'ios-preview-v' + info['CFBundleShortVersionString']
          PY
          mv release/study-trainer-unsigned.ipa release/study-trainer-ios-unsigned.ipa
          (cd release && sha256sum study-trainer-ios-unsigned.ipa > SHA256SUMS.txt)
      - name: Publish downloadable preview
        shell: bash
        run: |
          cp docs/release-notes-ios.md release-notes.md
          printf '\nSource commit: %s\n\nDevice IPA SHA-256: %s\n\nVerified build: https://github.com/%s/actions/runs/%s\n' "$BUILD_COMMIT" "$IPA_SHA256" "$GH_REPO" "$BUILD_RUN" >> release-notes.md
          if ! gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            gh release create "$PREVIEW_TAG" --verify-tag --title "Study Trainer for iPhone — $PREVIEW_TAG" --prerelease --draft --notes-file release-notes.md
          fi
          gh release upload "$PREVIEW_TAG" release/study-trainer-ios-unsigned.ipa release/SHA256SUMS.txt --clobber
          gh release edit "$PREVIEW_TAG" --draft=false --prerelease --notes-file release-notes.md
