name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: |
          for package in trainer_core trainer_storage trainer_lichess; do
            (cd packages/$package && dart pub get && dart analyze && dart test)
          done
          (cd packages/trainer_flutter && flutter pub get && flutter analyze && flutter test)
          (cd apps/standalone && flutter pub get && flutter analyze && flutter test)

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get && flutter build apk --debug --target-platform android-arm64
        working-directory: apps/standalone
