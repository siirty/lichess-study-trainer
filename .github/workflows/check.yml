name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: |
          for package in trainer_core trainer_storage trainer_lichess; do
            (cd packages/$package && dart pub get --enforce-lockfile && dart analyze && dart test)
          done
          (cd packages/trainer_flutter && flutter pub get --enforce-lockfile && flutter analyze && flutter test)
          (cd apps/standalone && flutter pub get --enforce-lockfile && flutter analyze && flutter test)

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile && flutter build apk --debug --target-platform android-arm64
        working-directory: apps/standalone
      # Test APK for personal devices. Only builds of main are uploaded, so pull
      # requests from forks can never publish an APK on this repository's pages.
      # Each run signs with a fresh, throwaway debug key: installing a newer run
      # means uninstalling first (export a backup), and nobody else can sign updates.
      - name: Build test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/standalone
        run: |
          flutter build apk --release --target-platform android-arm64
          mkdir -p ../../android-test
          cp build/app/outputs/flutter-apk/app-release.apk ../../android-test/study-trainer-android-test.apk
          cd ../../android-test && sha256sum study-trainer-android-test.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: android-test-apk
          path: android-test/
          retention-days: 14
          if-no-files-found: error
