name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: |
          for package in trainer_core trainer_storage trainer_lichess; do
            (cd packages/$package && dart pub get --enforce-lockfile && dart analyze && dart test)
          done
          (cd packages/trainer_flutter && flutter pub get --enforce-lockfile && flutter analyze && flutter test)
          (cd apps/standalone && flutter pub get --enforce-lockfile && flutter analyze && flutter test)

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile && flutter build apk --debug --target-platform android-arm64
        working-directory: apps/standalone
